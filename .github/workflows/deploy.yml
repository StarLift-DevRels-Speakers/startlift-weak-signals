name: Docker Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # checkout удаляет неотслеживаемые файлы, поэтому секреты лежат на стенде вне рабочей папки
      - name: Provide environment
        run: |
          ENV_FILE="$HOME/starlift/env/weak-signals.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found, see README (Deployment)"
            exit 1
          fi
          cp "$ENV_FILE" .env

      - name: Check backend network
        run: |
          docker network inspect java-speaker-net >/dev/null \
            || { echo "::error::Network java-speaker-net not found, deploy starlift-backend first"; exit 1; }

      - name: Build and Restart Docker Containers
        run: |
          docker compose up -d --build
          docker image prune -f
