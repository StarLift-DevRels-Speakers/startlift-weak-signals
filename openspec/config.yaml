schema: spec-driven

# Project constraints for OpenSpec artifacts.
rules:
  proposal:
    - "Write the proposal in Russian."
  specs:
    - "Write the spec delta in Russian."
    - "Keep format keywords in English: Purpose, ADDED/MODIFIED/REMOVED Requirements, Requirement, Scenario, WHEN, THEN, SHALL, MUST, MUST NOT, MAY."
  design:
    - "Write the design in Russian."
  tasks:
    - "Write the tasks in Russian."
